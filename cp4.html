<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>Checkpoint 4: WASM vs WebGPU Comparison</title>
    <style>
      .row {
        display: flex;
        gap: 20px;
      }
      .col {
        flex: 1;
        border: 1px solid #ccc;
        padding: 15px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Checkpoint 4: WASM vs WebGPU Comparison</h1>

    <div id="status">⏳ Loading...</div>
    <div id="input"></div>
    <hr />

    <!-- จัดเค้าโครงเปรียบเทียบ ซ้าย - ขวา -->
    <div class="row">
      <!-- ฝั่งซ้าย: WASM (CPU) -->
      <div class="col">
        <h3>WASM Result (CPU):</h3>
        <div id="wasm-output"></div>
        <div id="wasm-time"></div>
      </div>

      <!-- ฝั่งขวา: WebGPU (GPU) -->
      <div class="col">
        <h3>WebGPU Result (GPU):</h3>
        <div id="webgpu-output"></div>
        <div id="webgpu-time"></div>
      </div>
    </div>

    <hr />

    <h3>Comparison:</h3>
    <div id="diff"></div>

    <script type="module">
      import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0";

      async function compareWasmVsWebGPU() {
        const statusDiv = document.getElementById("status");
        const inputDiv = document.getElementById("input");
        const wasmOutputDiv = document.getElementById("wasm-output");
        const wasmTimeDiv = document.getElementById("wasm-time");
        const webgpuOutputDiv = document.getElementById("webgpu-output");
        const webgpuTimeDiv = document.getElementById("webgpu-time");
        const diffDiv = document.getElementById("diff");

        const inputText = "Looking for 5mm stainless steel sheets from Posco.";
        inputDiv.innerText = "Input Text: " + inputText;

        let wasmTime = 0;
        let webgpuTime = 0;

        // 1. ประมวลผล WASM (CPU)
        try {
          statusDiv.innerText = "⏳ Running WASM (CPU)...";
          const extractor_wasm = await pipeline(
            "token-classification",
            "Xenova/bert-base-NER",
            { device: "wasm" },
          );

          const startWasm = performance.now();
          const outputWasm = await extractor_wasm(inputText, {
            aggregation_strategy: "first",
          });
          wasmTime = performance.now() - startWasm;

          wasmOutputDiv.innerHTML = `
            <ul>
              ${outputWasm.map((item) => `<li><strong>${item.word}</strong> - Entity: ${item.entity_group || item.entity} (${(item.score * 100).toFixed(1)}%)</li>`).join("")}
            </ul>
            <details open>
              <summary>Raw Output Object (console.log)</summary>
              <pre>${JSON.stringify(outputWasm, null, 2)}</pre>
            </details>
          `;
          wasmTimeDiv.innerText = "Time: " + wasmTime.toFixed(2) + " ms";
        } catch (err) {
          wasmOutputDiv.innerText = "WASM Error: " + err.message;
        }

        // 2. ประมวลผล WebGPU (GPU)
        if (!navigator.gpu) {
          webgpuOutputDiv.innerText =
            "WebGPU is not supported on this browser.";
          statusDiv.innerText = "Completed WASM (WebGPU unsupported)";
          return;
        }

        try {
          statusDiv.innerText = "⏳ Running WebGPU...";
          const extractor_gpu = await pipeline(
            "token-classification",
            "Xenova/bert-base-NER",
            { device: "webgpu", dtype: "fp32" },
          );

          statusDiv.innerText = "🔥 Warming up WGSL Shaders...";
          await extractor_gpu("warm up");

          statusDiv.innerText = "⚡ Running WebGPU (GPU)...";
          const startGpu = performance.now();
          const outputGpu = await extractor_gpu(inputText, {
            aggregation_strategy: "first",
          });
          webgpuTime = performance.now() - startGpu;

          webgpuOutputDiv.innerHTML = `
            <ul>
              ${outputGpu.map((item) => `<li><strong>${item.word}</strong> - Entity: ${item.entity_group || item.entity} (${(item.score * 100).toFixed(1)}%)</li>`).join("")}
            </ul>
            <details open>
              <summary>Raw Output Object (console.log)</summary>
              <pre>${JSON.stringify(outputGpu, null, 2)}</pre>
            </details>
          `;
          webgpuTimeDiv.innerText = "Time: " + webgpuTime.toFixed(2) + " ms";
        } catch (err) {
          webgpuOutputDiv.innerText = "WebGPU Error: " + err.message;
        }

        // 3. เปรียบเทียบผลลัพธ์
        statusDiv.innerText = "✅ Benchmark Completed!";
        const diffMs = Math.abs(wasmTime - webgpuTime).toFixed(2);
        const winner = wasmTime < webgpuTime ? "WASM" : "WebGPU";
        diffDiv.innerText = `Result: ${winner} is faster by ${diffMs} ms`;

        console.log("--- Benchmark Results ---");
        console.log("WASM Time:", wasmTime.toFixed(2), "ms");
        console.log("WebGPU Time:", webgpuTime.toFixed(2), "ms");
        console.log(`Winner: ${winner} (Diff: ${diffMs} ms)`);
      }

      compareWasmVsWebGPU();
    </script>
  </body>
</html>
