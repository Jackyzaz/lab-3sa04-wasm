<!doctype html>
<html>
  <body>
    <h1>Main</h1>

    <script>
      async function loadWasm() {
        let result = await fetch("math.wasm");
        // แปลงไฟล์ Binary เป็ น Module ที่เบราว์เซอร์เข้าใจ
        let compiledmod = await WebAssembly.compile(await result.arrayBuffer());
        // สร้าง Instance เพื่อให้เรียกใช้งานฟังก์ชันได้
        let instance = new WebAssembly.Instance(compiledmod);

        // ทดสอบเรียก instance
        console.log("WASM Loaded!", instance);
        console.log("Square of 13 is:", instance.exports.square(13));
      }
      loadWasm();
    </script>
  </body>
</html>
